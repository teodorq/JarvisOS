name: Build JARVIS OS cloud planner

on:
  push:
    branches:
      - develop
    paths:
      - cloud_service/**
      - app/cloud/**
      - app/ai/actions.py
      - app/ai/planner_llm.py
      - app/ai/commands/**
      - tests/test_cloud*.py
      - tests/test_remote_command_bridge.py
      - tests/test_remote_power_control.py
      - infra/azure/**
      - .dockerignore
      - .github/workflows/cloud-image.yml
  workflow_dispatch:

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: read
  packages: write
  id-token: write

concurrency:
  group: jarvis-os-cloud-production
  cancel-in-progress: false

jobs:
  test-and-publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require successful full source integrity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const targetSha = context.sha;
            const acceptedEvents = context.eventName === 'push'
              ? new Set(['push'])
              : new Set(['push', 'workflow_dispatch']);
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'source-integrity.yml',
                per_page: 100,
              });
              const run = data.workflow_runs.find(
                item => item.head_sha === targetSha
                  && acceptedEvents.has(item.event)
              );
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(
                    'Full source integrity did not pass for '
                      + targetSha + ': ' + run.conclusion
                  );
                  return;
                }
                core.notice(
                  'Full source integrity passed for ' + targetSha + '.'
                );
                return;
              }
              core.info(
                'Waiting for full source integrity for ' + targetSha
                  + ' (' + attempt + '/120).'
              );
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed(
              'Timed out waiting for full source integrity for ' + targetSha
            );

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Test cloud boundary
        run: python -m unittest discover -s tests -p "test_cloud*.py" -v

      - name: Test phone command relay
        run: python -m pytest -q tests/test_remote_command_bridge.py tests/test_remote_power_control.py

      - name: Validate Azure templates
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2
        with:
          inlineScript: |
            az bicep build \
              --file infra/azure/subscription.bicep \
              --stdout > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cloud_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jarvis-os-cloud:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/jarvis-os-cloud
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy immutable image to Azure
    needs: test-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: 553e8a79-9004-49d5-b996-bc8f3768ffce
          tenant-id: 1f218598-c698-404f-908f-025fe1b55870
          subscription-id: c7cac745-0964-425d-97b4-61d19e4cef65

      - name: Capture previous healthy revision
        id: previous
        shell: bash
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          previous_image="$(az containerapp show \
            --name jarvis-os-planner \
            --resource-group rg-jarvis-os-cloud \
            --query properties.template.containers[0].image \
            --output tsv)"
          previous_sha="$(az containerapp show \
            --name jarvis-os-planner \
            --resource-group rg-jarvis-os-cloud \
            --query "properties.template.containers[0].env[?name=='JARVIS_OS_BUILD_SHA'].value | [0]" \
            --output tsv)"
          fqdn="$(az containerapp show \
            --name jarvis-os-planner \
            --resource-group rg-jarvis-os-cloud \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          if [[ ! "${previous_sha}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The current production build SHA is not immutable."
            exit 1
          fi
          if [[ "${previous_image}" != ghcr.io/*/jarvis-os-cloud:sha-"${previous_sha}" ]]; then
            echo "The current production image does not match its build SHA."
            exit 1
          fi
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --max-time 20 \
              "https://${fqdn}/health" || true)"
            if python -c 'import json,sys; data=json.loads(sys.argv[1]); valid=data.get("status") == "ok" and data.get("service") == "jarvis-os-cloud-planner" and data.get("build_sha") == sys.argv[2] and data.get("remote_access_verified") is True; raise SystemExit(0 if valid else 1)' "${response}" "${previous_sha}"; then
              echo "Current production revision ${previous_sha} is a healthy rollback target."
              echo "image=${previous_image}" >> "${GITHUB_OUTPUT}"
              echo "sha=${previous_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Rollback target check ${attempt}/12 is not ready yet."
            sleep 5
          done
          echo "Deployment stopped because the existing production revision is not healthy."
          exit 1

      - name: Deploy the verified image
        shell: bash
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          for attempt in $(seq 1 5); do
            if az containerapp update \
              --name jarvis-os-planner \
              --resource-group rg-jarvis-os-cloud \
              --image "ghcr.io/${{ github.repository_owner }}/jarvis-os-cloud:sha-${{ github.sha }}" \
              --cpu 0.25 \
              --memory 0.5Gi \
              --min-replicas 0 \
              --max-replicas 1 \
              --remove-env-vars \
                "JARVIS_OS_REMOTE_STORAGE_CONNECTION" \
              --set-env-vars \
                "JARVIS_OS_BUILD_SHA=${{ github.sha }}" \
                "JARVIS_OS_CLOUD_ENVIRONMENT=production" \
                "JARVIS_OS_REMOTE_STORAGE_ACCOUNT=jaroswfl24enbycwtyrelay" \
                "JARVIS_OS_REMOTE_TABLE=commands" \
                "JARVIS_OS_REMOTE_QUEUE=commands" \
                "JARVIS_OS_CLOUD_REQUESTS_PER_MINUTE=30" \
                "PORT=8000" \
              --only-show-errors \
              --output none; then
              if az containerapp secret list \
                --name jarvis-os-planner \
                --resource-group rg-jarvis-os-cloud \
                --query "[?name=='remote-storage-connection'].name" \
                --output tsv | grep -qx "remote-storage-connection"; then
                for secret_attempt in $(seq 1 6); do
                  if az containerapp secret remove \
                    --name jarvis-os-planner \
                    --resource-group rg-jarvis-os-cloud \
                    --secret-names remote-storage-connection \
                    --only-show-errors \
                    --output none; then
                    break
                  fi
                  if [ "${secret_attempt}" -eq 6 ]; then
                    echo "Storage connection secret could not be removed."
                    exit 1
                  fi
                  echo "Secret removal ${secret_attempt}/6 is waiting for revision propagation."
                  sleep 10
                done
              fi
              exit 0
            fi
            echo "Azure update ${attempt}/5 failed; retrying after 15 seconds."
            sleep 15
          done
          echo "Azure Container App update failed after 5 attempts."
          exit 1

      - name: Verify declared Azure configuration
        shell: bash
        run: |
          app_json="${RUNNER_TEMP}/jarvis-os-app.json"
          auth_json="${RUNNER_TEMP}/jarvis-os-auth.json"
          expected_image="ghcr.io/${{ github.repository_owner }}/jarvis-os-cloud:sha-${{ github.sha }}"
          for attempt in $(seq 1 12); do
            az containerapp show \
              --name jarvis-os-planner \
              --resource-group rg-jarvis-os-cloud \
              --output json > "${app_json}"
            az containerapp auth show \
              --name jarvis-os-planner \
              --resource-group rg-jarvis-os-cloud \
              --output json > "${auth_json}"
            if python infra/azure/verify_deployment.py \
              --app-json "${app_json}" \
              --auth-json "${auth_json}" \
              --expected-image "${expected_image}" \
              --expected-build-sha "${{ github.sha }}" \
              --expected-storage-account "jaroswfl24enbycwtyrelay" \
              --expected-tenant-id "1f218598-c698-404f-908f-025fe1b55870"; then
              exit 0
            fi
            echo "Azure declaration check ${attempt}/12 is not ready yet."
            sleep 5
          done
          echo "Azure configuration did not converge to the declaration."
          exit 1

      - name: Verify the deployed revision
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --name jarvis-os-planner \
            --resource-group rg-jarvis-os-cloud \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          health_url="https://${fqdn}/health"
          expected_sha="${{ github.sha }}"
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --max-time 20 "${health_url}" || true)"
            if python -c 'import json,sys; data=json.loads(sys.argv[1]); raise SystemExit(0 if data.get("status") == "ok" and data.get("service") == "jarvis-os-cloud-planner" and data.get("build_sha") == sys.argv[2] and data.get("remote_access_verified") is True else 1)' "${response}" "${expected_sha}"; then
              echo "JARVIS OS revision ${expected_sha} is healthy at ${health_url}."
              exit 0
            fi
            echo "Revision check ${attempt}/12 is not ready yet."
            sleep 5
          done
          echo "Azure did not serve the expected JARVIS OS revision ${expected_sha}."
          exit 1

      - name: Smoke-test public routes
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --name jarvis-os-planner \
            --resource-group rg-jarvis-os-cloud \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          for path in /mobile-start /mobile-logout /mobile-diagnostics /phone /phone.webmanifest; do
            curl --fail --silent --show-error --max-time 20 \
              "https://${fqdn}${path}" > /dev/null
            echo "Public route ${path} is available."
          done
          login_status="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out "%{http_code}" \
            "https://${fqdn}/.auth/login/aad?post_login_redirect_uri=%2Fphone")"
          case "${login_status}" in
            301|302|303|307|308)
              echo "Microsoft login route redirects correctly (${login_status})."
              ;;
            *)
              echo "Microsoft login route returned ${login_status}; expected a redirect."
              exit 1
              ;;
          esac

      - name: Restore previous healthy image after failure
        if: ${{ failure() && steps.previous.outputs.image != '' }}
        shell: bash
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          echo "Deployment failed; restoring the previous healthy immutable image."
          for attempt in $(seq 1 5); do
            if az containerapp update \
              --name jarvis-os-planner \
              --resource-group rg-jarvis-os-cloud \
              --image "${PREVIOUS_IMAGE}" \
              --set-env-vars "JARVIS_OS_BUILD_SHA=${PREVIOUS_SHA}" \
              --only-show-errors \
              --output none; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Automatic rollback could not restore the previous image."
              exit 1
            fi
            echo "Rollback update ${attempt}/5 failed; retrying after 15 seconds."
            sleep 15
          done
          fqdn="$(az containerapp show \
            --name jarvis-os-planner \
            --resource-group rg-jarvis-os-cloud \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --max-time 20 \
              "https://${fqdn}/health" || true)"
            if python -c 'import json,sys; data=json.loads(sys.argv[1]); valid=data.get("status") == "ok" and data.get("service") == "jarvis-os-cloud-planner" and data.get("build_sha") == sys.argv[2] and data.get("remote_access_verified") is True; raise SystemExit(0 if valid else 1)' "${response}" "${PREVIOUS_SHA}"; then
              echo "Automatic rollback restored healthy revision ${PREVIOUS_SHA}."
              exit 0
            fi
            echo "Rollback verification ${attempt}/12 is not ready yet."
            sleep 5
          done
          echo "Automatic rollback did not become healthy."
          exit 1
