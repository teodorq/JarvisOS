name: Build JARVIS cloud planner

on:
  push:
    branches:
      - develop
    paths:
      - cloud_service/**
      - app/cloud/**
      - app/ai/actions.py
      - app/ai/planner_llm.py
      - app/ai/commands/**
      - .dockerignore
      - .github/workflows/cloud-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jarvis-cloud-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test cloud boundary
        run: python -m unittest discover -s tests -p "test_cloud_migration.py" -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jarvisai-cloud:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
