name: JARVIS OS source integrity

on:
  push:
    branches:
      - develop
    paths:
      - app/**
      - cloud_service/**
      - software_engineer/**
      - tools/**
      - tests/**
      - requirements*.txt
      - main.py
      - pytest.ini
      - .github/workflows/source-integrity.yml
  pull_request:
    paths:
      - app/**
      - cloud_service/**
      - software_engineer/**
      - tools/**
      - tests/**
      - requirements*.txt
      - main.py
      - pytest.ini
      - .github/workflows/source-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-os-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Compile source
        run: python -m compileall -q app cloud_service software_engineer tools

      - name: Run regression suite
        run: python -m pytest -q
