name: JARVIS OS source integrity

on:
  push:
    branches:
      - develop
    paths:
      - app/**
      - cloud_service/**
      - software_engineer/**
      - tools/**
      - tests/**
      - requirements*.txt
      - infra/**
      - main.py
      - pytest.ini
      - .dockerignore
      - .github/workflows/**
  pull_request:
    paths:
      - app/**
      - cloud_service/**
      - software_engineer/**
      - tools/**
      - tests/**
      - requirements*.txt
      - infra/**
      - main.py
      - pytest.ini
      - .dockerignore
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-os-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install verified dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Compile source
        run: python -m compileall -q app cloud_service software_engineer tools

      - name: Validate Azure infrastructure
        run: |
          az bicep build --file infra/azure/main.bicep --stdout | Out-Null
          az bicep build --file infra/azure/subscription.bicep --stdout | Out-Null

      - name: Run regression suite
        run: |
          python -m pytest -q --maxfail=1 --durations=20 --junitxml=pytest-junit.xml 2>&1 | Tee-Object -FilePath pytest-out.txt
          $pytestExitCode = $LASTEXITCODE
          if ($pytestExitCode -ne 0) {
            Write-Output "::error title=Regression suite failed::pytest exited with code $pytestExitCode. Download the test artifact for details."
            exit $pytestExitCode
          }

      - name: Publish pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-source-integrity-${{ github.run_id }}
          path: |
            pytest-junit.xml
            pytest-out.txt
